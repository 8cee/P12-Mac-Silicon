canvas.addEventListener('pointerdown',e=>{if(e.button!==0||!state)return;const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,note=noteAt(x,y),node=e.target.closest('.note'),ctrl=e.ctrlKey||e.metaKey;const hit=node?{note:Number(node.dataset.note),step:Number(node.dataset.start)}:null,resize=!!node&&e.target.classList.contains('edge'),resizeLeft=resize&&e.target.classList.contains('left');drag={origin:note,hit,mode:resize?(resizeLeft?'resizeLeft':'resize'):node?(e.altKey?'copy':'move'):'empty',x:e.clientX,y:e.clientY,lastX:x,lastY:y,moved:false,ctrl,base:new Set(state.selected||[])};if(node){selectedKey=keyOf(hit);if(ctrl&&!resize&&!e.altKey){send('select',{note:hit.note,step:hit.step,add:true});drag.mode='toggle';}else send('select',{note:hit.note,step:hit.step});const real=(state.notes||[]).find(n=>keyOf(n)===selectedKey);if(real){noteVelocity=real.velocity||100;velocity.value=String(noteVelocity);document.getElementById('velLabel').textContent=String(noteVelocity)}}else{selectedKey=null;if(!ctrl)send('select',{note:note.note,step:note.step})}e.preventDefault()});
window.addEventListener('pointermove',e=>{if(!drag||!state)return;const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;drag.lastX=x;drag.lastY=y;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>4)drag.moved=true;if((drag.mode==='box'||drag.mode==='empty')&&drag.moved){rubber.style.display='block';rubber.style.left=Math.min(e.clientX,drag.x)+'px';rubber.style.top=Math.min(e.clientY,drag.y)+'px';rubber.style.width=Math.abs(e.clientX-drag.x)+'px';rubber.style.height=Math.abs(e.clientY-drag.y)+'px'}});
window.addEventListener('pointerup',e=>{if(!drag||!state)return;const d=drag;drag=null;rubber.style.display='none';const target=noteAt(d.lastX,d.lastY),origin=d.origin;if(d.mode==='toggle')return;if(d.mode==='resize'){if(d.moved){const real=(state.notes||[]).find(n=>keyOf(n)===keyOf(d.hit));if(real){let end=Math.max(real.start+1/6,quant(d.lastX/unit));send('resizeSelected',{note:real.note,step:real.start,lengthDelta:end-(real.start+real.length)})}}return}if(d.mode==='resizeLeft'){if(d.moved){const real=(state.notes||[]).find(n=>keyOf(n)===keyOf(d.hit));if(real){let start=clamp(quant(d.lastX/unit),0,real.start+real.length-1/6);send('resizeStartSelected',{note:real.note,step:real.start,startDelta:start-real.start})}}return}if(d.mode==='move'||d.mode==='copy'){if(d.moved){const dx=quant((e.clientX-d.x)/unit),dy=target.note-origin.note;send(d.mode==='copy'?'copyMove':'move',{noteDelta:dy,stepDelta:dx})}return}if(d.mode==='box'){if(d.moved)send('box',{...origin,toNote:target.note,toStep:target.step,add:d.ctrl});return}if(d.mode==='empty'){if(!d.moved)insertCursor=origin.step;if(d.moved)send('box',{...origin,toNote:target.note,toStep:target.step,add:d.ctrl});else{const duration=snap()*Math.max(1,Math.min(16,Number(drawLength.value)||1));send('create',{note:origin.note,step:origin.step,length:duration,velocity:noteVelocity,channel:Number(channel.value)||1,editGrid:editGrid.value});audition(origin.note);setTimeout(()=>{if(held===origin.note)releaseKey()},120)}return}});
function laneValueFromY(y,type){const h=lane.clientHeight||132,ratio=clamp(1-y/(h-8),0,1);return type==='pitchbend'?Math.round(ratio*16383):Math.round(ratio*127)}
function setLaneAt(e){if(!state)return;const r=lane.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,mode=laneType.value;if(mode==='velocity'){const bar=e.target.closest('.velbar');if(!bar)return;const v=clamp(laneValueFromY(y,'velocity'),1,127);send('select',{note:Number(bar.dataset.note),step:Number(bar.dataset.start),add:e.shiftKey||e.ctrlKey||e.metaKey});send('velocitySelected',{velocity:v});noteVelocity=v;velocity.value=String(v);document.getElementById('velLabel').textContent=String(v)}else{const type=mode==='cc1'?'cc':mode,controller=mode==='cc1'?1:0,start=pxStep(x),value=laneValueFromY(y,type);send('automationSet',{automationType:type,controller,start,value,channel:Number(channel.value)||1})}}
lane.addEventListener('pointerdown',e=>{if(e.button!==0)return;laneDrag=true;setLaneAt(e);e.preventDefault()});lane.addEventListener('pointermove',e=>{if(laneDrag&&e.buttons===1)setLaneAt(e)});window.addEventListener('pointerup',()=>laneDrag=false);lane.addEventListener('contextmenu',e=>{e.preventDefault();const p=e.target.closest('.autoPoint');if(!p)return;const mode=laneType.value,type=mode==='cc1'?'cc':mode;send('automationDelete',{automationType:type,controller:mode==='cc1'?1:0,start:Number(p.dataset.start),channel:Number(channel.value)||1})});
window.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName))return;const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();let cmd='';if(mod&&k==='a')cmd='selectAll';else if(mod&&k==='c')cmd='copy';else if(mod&&k==='x')cmd='cut';else if(mod&&k==='v')cmd='paste';else if(mod&&k==='z')cmd=e.shiftKey?'redo':'undo';else if(mod&&k==='y')cmd='redo';else if(e.key==='Delete'||e.key==='Backspace')cmd='delete';if(mod&&k==='d'){e.preventDefault();send('duplicate');return}if(mod&&k==='q'){e.preventDefault();send('quantize');return}if(mod&&e.shiftKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();send('move',{noteDelta:e.key==='ArrowUp'?12:-12,stepDelta:0});return}if(cmd){e.preventDefault();send(cmd);return}if((state?.selected||[]).length&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const step=e.shiftKey?1/6:snap();send('move',{noteDelta:e.key==='ArrowUp'?1:e.key==='ArrowDown'?-1:0,stepDelta:e.key==='ArrowRight'?step:e.key==='ArrowLeft'?-step:0});return}if(e.key==='Escape')releaseKey()});
send('state');setInterval(()=>{if(!state)send('state')},500);
</script></body></html>
